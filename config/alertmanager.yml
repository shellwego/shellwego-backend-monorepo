global:
  resolve_timeout: 5m

route:
  group_by: ['alertname', 'node']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: 'webhook'
  routes:
    - match:
        severity: critical
      receiver: 'webhook'
      repeat_interval: 1h

receivers:
  - name: 'webhook'
    webhook_configs:
      - url: 'http://control-plane:8080/v1/alerts'
        send_resolved: true

inhibit_rules:
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname', 'node']
