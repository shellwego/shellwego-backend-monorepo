global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'shellwego'

rule_files:
  - 'prometheus_alerts.yml'

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - 'alertmanager:9093'

scrape_configs:
  - job_name: 'shellwego-control-plane'
    static_configs:
      - targets: ['control-plane:9090']
    metrics_path: '/metrics'
    scrape_interval: 15s

  - job_name: 'shellwego-agents'
    static_configs:
      - targets: ['agent:9100']
    metrics_path: '/metrics'
    scrape_interval: 10s

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
