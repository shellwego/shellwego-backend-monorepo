[workspace]
members = ["crates/*"]
resolver = "2"

# Reduce disk and memory usage during builds
[profile.dev]
codegen-units = 256
debug = 1
incremental = true

[profile.dev.package."*"]
codegen-units = 256
opt-level = 0

[profile.release]
codegen-units = 16
debug = false
lto = "thin"

# CI profile - optimized for speed and low memory
[profile.ci]
inherits = "dev"
codegen-units = 256
debug = 0
incremental = false
opt-level = 0

# Clippy configuration
[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
nursery = "allow"
cargo = "warn"

# Allow some common patterns
multiple_crate_versions = "allow"
module_name_repetitions = "allow"
too_many_arguments = "allow"
too_many_lines = "allow"
similar_names = "allow"
struct_excessive_bools = "allow"
default_trait_access = "allow"
explicit_deref_methods = "allow"
implicit_hasher = "allow"
items_after_statements = "allow"
match_same_arms = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
redundant_pub_crate = "allow"
return_self_not_must_use = "allow"
used_underscore_binding = "allow"

[workspace.package]
version = "0.1.0-alpha.1"
edition = "2021"
authors = ["ShellWeGo Contributors"]
license = "AGPL-3.0-or-later"
repository = "https://github.com/shellwego/shellwego"
rust-version = "1.75"

[workspace.dependencies]
# Async runtime
tokio = { version = "1.35", features = ["full"] }
tokio-util = "0.7"
async-trait = "0.1"

# Web framework & HTTP
axum = { version = "0.7", features = ["macros"] }
tower = "0.4"
hyper = { version = "1.0", features = ["full"] }
reqwest = { version = "0.11", features = ["json", "rustls-tls"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_with = "3.4"

# Data types
uuid = { version = "1.6", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

# Database
sqlx = { version = "0.7", features = ["runtime-tokio-rustls", "postgres", "sqlite", "uuid", "chrono"] }

# CLI
clap = { version = "4.4", features = ["derive", "env"] }

# Documentation/OpenAPI
utoipa = { version = "4.1", features = ["axum_extras", "uuid", "chrono"] }

# Utilities
thiserror = "1.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"
config = "0.14"
strum = { version = "0.25", features = ["derive"] }
validator = { version = "0.16", features = ["derive"] }

# WASM runtime
wasmtime = { version = "12.0" }

# eBPF
aya = { version = "0.13" }
aya-log = "0.2"

# Metrics & observability
prometheus = "0.13"
opentelemetry = "0.21"

# Security
rustls = "0.22"
rustls-pemfile = "2.1"
webpki = "0.22"
rcgen = "0.11"

# Concurrency
dashmap = "6.1"
