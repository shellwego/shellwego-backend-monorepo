global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'shellwego-control-plane'
    static_configs:
      - targets: ['control-plane:8080']
    metrics_path: '/metrics'
    scrape_interval: 10s

  - job_name: 'shellwego-agent'
    static_configs:
      - targets: ['agent:9090']
    metrics_path: '/metrics'
    scrape_interval: 10s
