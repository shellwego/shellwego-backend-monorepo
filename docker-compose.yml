version: "3.8"

services:
  # Control plane
  control-plane:
    build:
      context: .
      dockerfile: docker/control-plane.Dockerfile
    ports:
      - "8080:8080"
    environment:
      - DATABASE_URL=postgres://shellwego:shellwego@postgres:5432/shellwego
      - NATS_URL=nats://nats:4222
      - RUST_LOG=info
    depends_on:
      - postgres
      - nats

  # Agent (for local testing, requires privileged)
  agent:
    build:
      context: .
      dockerfile: docker/agent.Dockerfile
    privileged: true
    environment:
      - CONTROL_PLANE_URL=http://control-plane:8080
      - NODE_REGION=local
      - RUST_LOG=info
    volumes:
      - /dev/kvm:/dev/kvm
      - agent-data:/var/lib/shellwego
    depends_on:
      - control-plane

  # Supporting services
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: shellwego
      POSTGRES_PASSWORD: shellwego
      POSTGRES_DB: shellwego
    volumes:
      - postgres-data:/var/lib/postgresql/data

  nats:
    image: nats:2.10-alpine
    ports:
      - "4222:4222"
    command: "--js"  # Enable JetStream

  # Observability
  prometheus:
    image: prom/prometheus:v2.51.0
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./config/prometheus_alerts.yml:/etc/prometheus/prometheus_alerts.yml
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-lifecycle'
    ports:
      - "9090:9090"
    depends_on:
      - control-plane

  alertmanager:
    image: prom/alertmanager:v0.27.0
    volumes:
      - ./config/alertmanager.yml:/etc/alertmanager/alertmanager.yml
    ports:
      - "9093:9093"

  loki:
    image: grafana/loki:2.9.6
    volumes:
      - ./config/loki.yml:/etc/loki/local-config.yaml
      - loki-data:/loki
    ports:
      - "3100:3100"

  grafana:
    image: grafana/grafana:10.4.2
    volumes:
      - ./config/grafana/provisioning:/etc/grafana/provisioning
      - ./config/grafana/dashboards:/var/lib/grafana/dashboards
      - grafana-data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_AUTH_ANONYMOUS_ENABLED=false
      - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/var/lib/grafana/dashboards/01-platform-overview.json
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
      - loki

volumes:
  postgres-data:
  agent-data:
  prometheus-data:
  loki-data:
  grafana-data:
