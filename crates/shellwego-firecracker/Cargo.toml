[package]
name = "shellwego-firecracker"
version = "0.5.0"
edition = "2021"
authors = ["ShellWeGo Contributors"]
license = "AGPL-3.0-or-later"
description = "Comprehensive Firecracker MicroVM API SDK for Rust"
readme = "README.md"
keywords = ["firecracker", "microvm", "virtualization", "vmm", "sdk"]
categories = ["api-bindings", "virtualization"]
homepage = "https://github.com/shellwego/shellwego"
repository = "https://github.com/shellwego/shellwego"
documentation = "https://docs.rs/shellwego-firecracker"

[dependencies]
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["full"] }
hyper = { workspace = true, features = ["full"] }
bytes = "1.5"
http-body-util = "0.1"
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
async-trait = "0.1"
hyper-util = { version = "0.1", features = ["full"] }

[dev-dependencies]
tokio-test = "0.4"

[features]
default = []
# Enable experimental features (vsock, balloon, memory hotplug)
experimental = []

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
