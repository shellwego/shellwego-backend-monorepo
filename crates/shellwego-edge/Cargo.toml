[package]
name = "shellwego-edge"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Edge proxy, load balancer, and TLS termination"

[dependencies]
# HTTP server
hyper = { version = "0.14", features = ["full", "backports"] }
http-body-util = "0.1"
http = "1.0"
bytes = "1.5"

# TLS
rustls = "0.23"
rustls-pemfile = "2.0"
tokio-rustls = "0.26"

# ACME client
rcgen = "0.12"

# Async runtime
tokio = { workspace = true, features = ["net", "rt", "sync", "time", "signal", "macros"] }

# Routing
regex = "1.10"

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# Errors
thiserror = { workspace = true }
anyhow = { workspace = true }

# Tracing
tracing = { workspace = true }

# Additional dependencies used in code
parking_lot = "0.12"
uuid = { workspace = true }
rand = "0.8"
async-trait = { workspace = true }
chrono = { workspace = true }

[dev-dependencies]
tokio-test = "0.4"

# Reduce compile time for this crate
[profile.dev.package.shellwego-edge]
opt-level = 0
debug = 0