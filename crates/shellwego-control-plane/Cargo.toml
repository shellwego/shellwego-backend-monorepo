[package]
name = "shellwego-control-plane"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Control plane: REST API, scheduler, and cluster state management"

[lib]
name = "shellwego_control_plane"
path = "src/lib.rs"

[[bin]]
name = "shellwego-control-plane"
path = "src/main.rs"

[dependencies]
# Internal crates
shellwego-schema = { path = "../shellwego-schema" }
shellwego-storage = { path = "../shellwego-storage" }

# Async runtime
tokio = { workspace = true }

# Web framework
axum = { workspace = true }
tower = { workspace = true }
tower-http = { version = "0.5", features = ["cors", "trace", "compression-full", "request-id"] }
hyper = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }
toml = "0.8"

# Tracing
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

# Utilities
thiserror = { workspace = true }
anyhow = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
dashmap = { workspace = true }

# HTTP client for health checks
reqwest = { version = "0.11", features = ["json", "rustls-tls"] }

# Async trait
async-trait = { workspace = true }

# Futures utilities
futures = "0.3"

# Random for password generation
rand = "0.8"

# Base64 for KMS
base64 = "0.21"

# Database
sqlx = { workspace = true, features = ["any", "runtime-tokio-rustls", "sqlite"] }

# Authentication
jsonwebtoken = { version = "9", features = ["use_pem"] }
rsa = "0.9"
rand_core = { version = "0.6", features = ["std"] }
sha2 = "0.10"
aes-gcm = "0.10"
argon2 = "0.5"
password-hash = "0.5"

[dev-dependencies]
tower = { workspace = true, features = ["util"] }
http-body-util = "0.1"
sqlx = { workspace = true, features = ["any", "runtime-tokio-rustls", "sqlite"] }

[lints]
workspace = true
