[package]
name = "shellwego-billing"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Billing, metering, and payment processing"

[dependencies]
# Schema types (billing entities)
shellwego-schema = { path = "../shellwego-schema" }

# Async runtime
tokio = { workspace = true, features = ["time", "sync", "macros", "rt-multi-thread"] }

# Database
sqlx = { workspace = true, features = ["postgres", "runtime-tokio-rustls", "rust_decimal"] }

# Payment providers
async-stripe = { version = "0.34", features = ["runtime-tokio-hyper"], optional = true }
reqwest = { version = "0.11", features = ["json", "rustls-tls"], default-features = false }

# PDF generation (pure Rust, no Chrome dependency)
genpdf = { version = "0.2", optional = true }

# Template engine
tera = "1.19"

# Currency and decimals
rust_decimal = "1.33"
rust_decimal_macros = "1.33"
iso_currency = "0.4"

# URL encoding
urlencoding = "2.1"

# Serialization
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }

# Time handling
chrono = { workspace = true, features = ["serde"] }

# UUID for identifiers
uuid = { workspace = true, features = ["v4", "serde"] }

# Webhook signature verification
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
base64 = "0.21"

# Async trait for provider interface
async-trait = "0.1"

# Concurrency
dashmap = { workspace = true }

# Errors
thiserror = { workspace = true }
anyhow = { workspace = true }

# Tracing
tracing = { workspace = true }

[features]
default = []
pdf = ["dep:genpdf"]
stripe = ["dep:async-stripe"]
mpesa = []
paystack-provider = []

[dev-dependencies]
tokio-test = "0.4"
