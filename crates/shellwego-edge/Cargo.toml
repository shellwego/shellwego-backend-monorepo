[package]
name = "shellwego-edge"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Edge proxy, load balancer, and TLS termination"

[dependencies]
# HTTP server
hyper = { version = "0.14", features = ["full", "backports"] }
http-body-util = "0.1"
http = "1.0"
bytes = "1.5"

# TLS
rustls = { version = "0.23", features = ["ring"] }
rustls-pemfile = "2.0"
tokio-rustls = "0.26"

# ACME client
rcgen = "0.12"
reqwest = { workspace = true, features = ["json", "rustls-tls"] }
base64 = "0.22"
ring = "0.17"
p256 = { version = "0.13", features = ["ecdsa", "pem", "arithmetic"] }
ecdsa = "0.16"
rsa = "0.9"
sha2 = "0.10"
hex = "0.4"

# WebSocket proxy
tokio-tungstenite = "0.21"

# Async runtime
tokio = { workspace = true, features = ["net", "rt", "rt-multi-thread", "sync", "time", "signal", "macros", "io-util", "fs"] }

# Routing
regex = "1.10"

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# Errors
thiserror = { workspace = true }
anyhow = { workspace = true }

# Tracing
tracing = { workspace = true }

# Additional dependencies used in code
parking_lot = "0.12"
futures-util = "0.3"
uuid = { workspace = true }
rand = "0.8"
async-trait = { workspace = true }
chrono = { workspace = true }

[dev-dependencies]
tokio-test = "0.4"

# Reduce compile time for this crate
[profile.dev.package.shellwego-edge]
opt-level = 0
debug = 0