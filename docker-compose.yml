# =============================================================================
# ShellWeGo Development Stack
# =============================================================================
# NOTE: This docker-compose.yml is for development/testing only.
# For production, use the Helm chart or install.sh.
# =============================================================================

version: "3.8"

services:
  # Control plane
  control-plane:
    build:
      context: .
      dockerfile: docker/control-plane.Dockerfile
    ports:
      - "8080:8080"
    environment:
      - DATABASE_URL=postgres://shellwego:shellwego@postgres:5432/shellwego
      - NATS_URL=nats://nats:4222
      - RUST_LOG=info
      - SHELLWEGO_DOMAIN=localhost
      - ADMIN_EMAIL=admin@localhost
      - STATIC_DIR=/var/lib/shellwego/static
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # Agent (for local testing, requires privileged)
  agent:
    build:
      context: .
      dockerfile: docker/agent.Dockerfile
    privileged: true
    environment:
      - CONTROL_PLANE_URL=http://control-plane:8080
      - NODE_REGION=local
      - RUST_LOG=info
    volumes:
      - /dev/kvm:/dev/kvm
      - agent-data:/var/lib/shellwego
    depends_on:
      - control-plane
    restart: unless-stopped

  # Supporting services
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: shellwego
      POSTGRES_PASSWORD: shellwego
      POSTGRES_DB: shellwego
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shellwego"]
      interval: 5s
      timeout: 3s
      retries: 5

  nats:
    image: nats:2.10-alpine
    ports:
      - "4222:4222"
    command: "--js"  # Enable JetStream

  # Observability
  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin

volumes:
  postgres-data:
  agent-data:
